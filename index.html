<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.A.S.E. - Base de Acompanhamento do Sistema Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container topo">
      <a href="#inicio"><img class="logo" src="img/logo-oficial-base.webp" alt="Logo oficial B.A.S.E."></a>
      <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#web">Sistema Web</a>
        <a href="#mobile">Aplicativo</a>
      </nav>
    </div>
  </header>

  <main id="inicio">
    <section class="hero">
      <div class="container">
        <img src="img/hero-ecosistema.webp" alt="Ecossistema B.A.S.E.">
      </div>
    </section>

    <section id="sobre">
      <div class="container">
        <h1>B.A.S.E.</h1>
        <p>Base de Acompanhamento do Sistema Escolar.</p>
        <p>Uma solução para organizar informações escolares, melhorar a comunicação e facilitar o acompanhamento acadêmico.</p>
      </div>
    </section>

    <section id="web">
      <div class="container">
        <h2>Sistema Web</h2>
        <img src="img/sistema-web-profissional.webp" alt="Sistema Web B.A.S.E.">
      </div>
    </section>

    <section id="mobile">
      <div class="container">
        <h2>Aplicativo Mobile</h2>
        <img src="img/aplicativo-mobile-completo.webp" alt="Aplicativo Mobile B.A.S.E.">
      </div>
    </section>
  </main>

  <footer>B.A.S.E. - Base de Acompanhamento do Sistema Escolar</footer>

</html>
